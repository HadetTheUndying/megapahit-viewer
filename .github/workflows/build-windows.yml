name: Windows Build

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'test/*'
      - 'build/*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Windows x64
    # VS 2026 image: its CMake (4.x) + VS 18 2026 generator emit .slnx solution
    # files, which megapahit's CMake (LLPrimitive.cmake, main build) expects.
    # windows-2022 ships VS 2022, whose generator emits classic .sln and breaks
    # the colladadom build + main MSBuild step.
    runs-on: windows-2025-vs2026

    steps:
      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Restore vcpkg cache (x64)
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: Install vcpkg dependencies (x64)
        shell: bash
        run: |
          # The viewer uses a broad swath of boost: many header-only libraries
          # (signals2, stacktrace, bind, function, ...) AND several compiled
          # ones that produce .lib files (context, fiber, filesystem, thread,
          # program_options, json, url). Install the full `boost` metapackage
          # so every header is present, and ALSO name the compiled components
          # explicitly so their .lib files are guaranteed to be produced even
          # if a given vcpkg resolve would otherwise skip them. (Installing
          # only the compiled components starves the header-only includes;
          # installing only the metapackage previously left the .libs missing
          # on a stale cache-hit resolve. Listing both, on a clean resolve,
          # covers both failure modes.) The clean resolve is ensured because
          # editing this file changes the vcpkg cache key below.
          vcpkg install \
            python3:x64-windows \
            freealut:x64-windows \
            apr-util:x64-windows \
            boost:x64-windows \
            boost-context:x64-windows \
            boost-fiber:x64-windows \
            boost-filesystem:x64-windows \
            boost-thread:x64-windows \
            boost-program-options:x64-windows \
            boost-json:x64-windows \
            boost-url:x64-windows \
            freetype:x64-windows \
            glm:x64-windows \
            hunspell:x64-windows \
            libjpeg-turbo:x64-windows \
            meshoptimizer:x64-windows \
            minizip:x64-windows \
            nanosvg:x64-windows \
            nghttp2:x64-windows \
            openjpeg:x64-windows \
            libvorbis:x64-windows \
            "libxml2[tools]:x64-windows" \
            xxhash:x64-windows

      - name: Save vcpkg cache (x64)
        # Save even if a later step fails, so we don't recompile deps each run.
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}

      - name: Configure (x64)
        shell: bash
        env:
          LL_BUILD: "/MD /O2 /Ob2 /std:c++20 /Zc:wchar_t- /Zi /GR /DLL_RELEASE=1 /DLL_RELEASE_FOR_DOWNLOAD=1 /DNDEBUG /D_SECURE_STL=0 /D_HAS_ITERATOR_DEBUGGING=0 /DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DUNICODE /D_UNICODE /DWINVER=0x0602 /D_WIN32_WINNT=0x0602"
        run: |
          export PYTHON="$VCPKG_ROOT/installed/x64-windows/tools/python3/python.exe"
          CMAKE_BIN=$(find "$VCPKG_ROOT/downloads/tools" -name "cmake.exe" -path "*/x86_64/*" | head -1)
          if [ -z "$CMAKE_BIN" ]; then
            CMAKE_BIN=cmake
          fi
          mkdir build-windows-x86_64
          cd build-windows-x86_64
          "$CMAKE_BIN" \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DADDRESS_SIZE:STRING=64 \
            -DUSE_OPENAL:BOOL=ON \
            -DUSE_FMODSTUDIO:BOOL=OFF \
            -DENABLE_MEDIA_PLUGINS:BOOL=ON \
            -DLL_TESTS:BOOL=OFF \
            -DNDOF:BOOL=OFF \
            -DROOT_PROJECT_NAME:STRING=Megapahit \
            -DVIEWER_CHANNEL:STRING=Megapahit \
            -DVIEWER_BINARY_NAME:STRING=Megapahit \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            -DINSTALL:BOOL=ON \
            -DPACKAGE:BOOL=ON \
            "-DCMAKE_TOOLCHAIN_FILE:FILEPATH=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVS_DISABLE_FATAL_WARNINGS:BOOL=ON \
            ../indra

      - name: Build (x64)
        shell: bash
        run: |
          cd build-windows-x86_64
          MSBuild.exe Megapahit.slnx -p:Configuration=Release -m

      - name: Install NSIS (x64)
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # Add NSIS to PATH for the cpack step (makensis lives here)
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package (x64)
        shell: bash
        run: |
          cd build-windows-x86_64
          cpack -G NSIS

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat indra/newview/viewer_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact (x64)
        uses: actions/upload-artifact@v6
        with:
          name: megapahit-windows-x64-${{ steps.version.outputs.version }}
          path: build-windows-x86_64/Megapahit-*-win64.exe
          if-no-files-found: error

      - name: Upload to release (x64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: build-windows-x86_64/Megapahit-*-win64.exe
          prerelease: ${{ startsWith(github.ref_name, 'test/') || startsWith(github.ref_name, 'build/') }}

  build-windows-arm64:
    name: Windows arm64
    # Disabled until a native arm64 Windows runner (windows-11-arm) is available.
    # Cross-compiling on an x64 host fails: the colladadom step builds an x64 lib
    # that won't link against an arm64 viewer. To re-enable, set `if: true` (or
    # remove this line) and change runs-on to windows-11-arm.
    if: false
    runs-on: windows-2022

    steps:
      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Restore vcpkg cache (arm64)
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-arm64-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}
          restore-keys: |
            vcpkg-arm64-windows-

      - name: Install vcpkg dependencies (arm64)
        shell: bash
        run: |
          vcpkg install \
            python3:arm64-windows \
            freealut:arm64-windows \
            apr-util:arm64-windows \
            boost:arm64-windows \
            curl:arm64-windows \
            freetype:arm64-windows \
            glm:arm64-windows \
            hunspell:arm64-windows \
            libjpeg-turbo:arm64-windows \
            meshoptimizer:arm64-windows \
            minizip:arm64-windows \
            nanosvg:arm64-windows \
            nghttp2:arm64-windows \
            openjpeg:arm64-windows \
            sse2neon:arm64-windows \
            libvorbis:arm64-windows \
            "libxml2[tools]:arm64-windows" \
            xxhash:arm64-windows
          vcpkg install boost-fiber:arm64-windows --allow-unsupported || true

      - name: Save vcpkg cache (arm64)
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-arm64-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}

      - name: Configure (arm64)
        shell: bash
        env:
          LL_BUILD: "/MD /O2 /Ob2 /std:c++20 /Zc:wchar_t- /Zi /GR /DLL_RELEASE=1 /DLL_RELEASE_FOR_DOWNLOAD=1 /DNDEBUG /D_SECURE_STL=0 /D_HAS_ITERATOR_DEBUGGING=0 /DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DUNICODE /D_UNICODE /DWINVER=0x0602 /D_WIN32_WINNT=0x0602 /Zc:preprocessor"
        run: |
          export PYTHON="$VCPKG_ROOT/installed/arm64-windows/tools/python3/python.exe"
          CMAKE_BIN=$(find "$VCPKG_ROOT/downloads/tools" -name "cmake.exe" -path "*/arm64/*" | head -1)
          if [ -z "$CMAKE_BIN" ]; then
            CMAKE_BIN=$(find "$VCPKG_ROOT/downloads/tools" -name "cmake.exe" | head -1)
          fi
          if [ -z "$CMAKE_BIN" ]; then
            CMAKE_BIN=cmake
          fi
          mkdir build-windows-aarch64
          cd build-windows-aarch64
          "$CMAKE_BIN" \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DADDRESS_SIZE:STRING=64 \
            -DUSE_OPENAL:BOOL=ON \
            -DUSE_FMODSTUDIO:BOOL=OFF \
            -DENABLE_MEDIA_PLUGINS:BOOL=OFF \
            -DLL_TESTS:BOOL=OFF \
            -DNDOF:BOOL=OFF \
            -DROOT_PROJECT_NAME:STRING=Megapahit \
            -DVIEWER_CHANNEL:STRING=Megapahit \
            -DVIEWER_BINARY_NAME:STRING=Megapahit \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            -DINSTALL:BOOL=ON \
            -DPACKAGE:BOOL=ON \
            "-DCMAKE_TOOLCHAIN_FILE:FILEPATH=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET:STRING=arm64-windows \
            -DVS_DISABLE_FATAL_WARNINGS:BOOL=ON \
            ../indra

      - name: Build (arm64)
        shell: bash
        run: |
          cd build-windows-aarch64
          MSBuild.exe Megapahit.slnx -p:Configuration=Release -m

      - name: Package (arm64)
        shell: bash
        run: |
          cd build-windows-aarch64
          cpack -G NSIS

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat indra/newview/viewer_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact (arm64)
        uses: actions/upload-artifact@v6
        with:
          name: megapahit-windows-arm64-${{ steps.version.outputs.version }}
          path: build-windows-aarch64/Megapahit-*-win64.exe
          if-no-files-found: error

      - name: Upload to release (arm64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: build-windows-aarch64/Megapahit-*-win64.exe
          prerelease: ${{ startsWith(github.ref_name, 'test/') || startsWith(github.ref_name, 'build/') }}
