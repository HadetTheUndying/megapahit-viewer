name: macOS Build

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'test/*'
      - 'build/*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (arm64)
    # GitHub macOS runners are Apple Silicon; this produces an arm64 build
    # via -DCMAKE_OSX_ARCHITECTURES=$(uname -m). For an Intel artifact,
    # add a matrix entry on macos-13 later.
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Patch CEF/VLC version guard for macOS
        shell: bash
        run: |
          # The viewer guards its CEF/Dullahan + libVLC version-reporting code
          # with `#if !_M_ARM64`. _M_ARM64 is an MSVC-only predefined macro, so
          # it is never defined under Clang on macOS (even on Apple Silicon).
          # The block therefore compiles on macOS and fails on the missing
          # `cef/dullahan_version.h` header when those headers are not on the
          # include path. Excluding Apple here matches the block's evident
          # intent (skip it on platforms where the CEF/VLC version headers
          # aren't present in this configuration). The `set -e` + count check
          # makes this fail loudly if the upstream guard text ever changes,
          # rather than silently no-op.
          set -euo pipefail
          f=indra/newview/llappviewer.cpp
          before=$(grep -c '#if !_M_ARM64 // !LL_LINUX' "$f")
          if [ "$before" -ne 3 ]; then
            echo "ERROR: expected 3 '#if !_M_ARM64 // !LL_LINUX' guards, found $before."
            echo "Upstream source changed; re-check the macOS CEF/VLC patch."
            grep -n '_M_ARM64' "$f" || true
            exit 1
          fi
          perl -pi -e 's{#if !_M_ARM64 // !LL_LINUX}{#if !_M_ARM64 \&\& !defined(__APPLE__) // !LL_LINUX / !LL_DARWIN}g' "$f"
          after=$(grep -c '!defined(__APPLE__)' "$f")
          echo "Patched $after guard(s) in $f."
          [ "$after" -eq 3 ]

      - name: Set up MacPorts (installs cached deps from parameter file)
        uses: melusina-org/setup-macports@v1
        with:
          # Ports are listed in this file so the action installs them under
          # its built-in cache (keyed on macOS version + this file). This is
          # what makes the slow boost/ICU compile reused across runs instead
          # of rebuilt every time.
          parameters: .github/parameters/setup-macports.yaml

      - name: Dump MacPorts logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== searching for MacPorts main.log files ==="
          LOGDIR="/opt/local/var/macports/logs"
          find "$LOGDIR" -name "main.log" 2>/dev/null | while read -r log; do
            echo ""
            echo "######################################################"
            echo "### $log"
            echo "######################################################"
            # The actual compiler error is usually near the end; show the tail.
            tail -n 80 "$log"
          done

      - name: Configure
        shell: bash
        run: |
          # Resolve the active SDK path dynamically rather than hardcoding
          # the README's literal /Applications/Xcode.app/... path.
          SDKPATH="$(xcrun --show-sdk-path)"
          export LL_BUILD="-O3 -gdwarf-2 -stdlib=libc++ -mmacosx-version-min=12 -iwithsysroot $SDKPATH -std=c++20 -fPIC -DLL_RELEASE=1 -DLL_RELEASE_FOR_DOWNLOAD=1 -DNDEBUG -DPIC -DLL_DARWIN=1"

          mkdir build-macos && cd build-macos
          # NOTE: ENABLE_MEDIA_PLUGINS is OFF as a temporary measure. With it
          # ON, the viewer bundles libVLC and runs install_name_tool on the
          # VLC dylibs *after* ad-hoc signing, which invalidates their code
          # signatures (libvlc/libvlccore fail `codesign --verify`, and the
          # app is SIGKILL'd at launch: "Code Signature Invalid"). Only the
          # VLC dylibs are affected. For test builds of non-media features
          # this is an acceptable drop. TODO before official releases: fix the
          # signing order so VLC dylibs are (re)signed after their rpath
          # fixups, then set this back to ON.
          cmake \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DADDRESS_SIZE:STRING=64 \
            -DUSE_OPENAL:BOOL=ON \
            -DUSE_FMODSTUDIO:BOOL=OFF \
            -DENABLE_MEDIA_PLUGINS:BOOL=OFF \
            -DLL_TESTS:BOOL=OFF \
            -DNDOF:BOOL=OFF \
            -DROOT_PROJECT_NAME:STRING=Megapahit \
            -DVIEWER_CHANNEL:STRING=Megapahit \
            -DVIEWER_BINARY_NAME:STRING=megapahit \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            -DINSTALL:BOOL=ON \
            -DPACKAGE:BOOL=OFF \
            -DCMAKE_INSTALL_PREFIX:PATH=newview/Megapahit.app/Contents/Resources \
            -DCMAKE_OSX_ARCHITECTURES:STRING=$(uname -m) \
            -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING=12 \
            -DENABLE_SIGNING:BOOL=ON \
            -DSIGNING_IDENTITY:STRING=- \
            ../indra

      - name: Build
        shell: bash
        run: |
          cd build-macos
          make -j$(sysctl -n hw.ncpu)

      - name: Install into app bundle
        shell: bash
        run: |
          cd build-macos
          make install

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat indra/newview/viewer_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Package .app into a .dmg
        shell: bash
        run: |
          cd build-macos/newview
          # A .dmg preserves the bundle byte-for-byte (symlinks, perms, xattrs),
          # so the ad-hoc code signature stays valid. A zip round-trip can
          # dereference framework symlinks and break the seal, which shows up
          # as "code or signature have been modified" / "app is damaged".
          hdiutil create \
            -volname "Megapahit" \
            -srcfolder "Megapahit.app" \
            -ov -format UDZO \
            "Megapahit-${{ steps.version.outputs.version }}-macos-$(uname -m).dmg"

      - name: Verify signature survived packaging
        shell: bash
        run: |
          cd build-macos/newview
          # Mount the dmg and verify the signature inside it is still intact.
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -mountpoint "$MNT" \
            Megapahit-*-macos-*.dmg
          codesign --verify --deep --strict --verbose=2 "$MNT/Megapahit.app" || {
            echo "Signature verification FAILED inside the dmg"
            hdiutil detach "$MNT" || true
            exit 1
          }
          hdiutil detach "$MNT"
          echo "Signature verified intact inside the dmg."

      - name: Upload app artifact
        uses: actions/upload-artifact@v6
        with:
          name: megapahit-macos-${{ steps.version.outputs.version }}
          path: build-macos/newview/Megapahit-*-macos-*.dmg
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: build-macos/newview/Megapahit-*-macos-*.dmg
          prerelease: ${{ startsWith(github.ref_name, 'test/') || startsWith(github.ref_name, 'build/') }}
